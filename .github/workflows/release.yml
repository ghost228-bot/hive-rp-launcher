name: release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --win -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: mvn -B -f plugin/pom.xml package
      - uses: softprops/action-gh-release@v2
        with:
          files: plugin/target/LauncherGuard.jar  build-auroracore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build AuroraCore
        run: mvn -B package --file plugin/auroracore/pom.xml
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/auroracore/target/AuroraCore.jar
