<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>HIVE RP Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


<!-- ===== полноэкранный вход (как в GTA5RP) ===== -->
<div id="login-screen" class="hidden">
  <div class="ls-drag"></div>
  <div class="ls-winbtns">
    <button id="ls-min">─</button>
    <button id="ls-close" class="close">✕</button>
  </div>

  <div class="ls-art">
    <svg viewBox="0 0 420 900" preserveAspectRatio="xMidYMax slice">
      <defs>
        <pattern id="hexes" width="52" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(1.1)">
          <path d="M26 2 48 15v26L26 54 4 41V15z" fill="none" stroke="rgba(255,122,0,.28)" stroke-width="2"/>
        </pattern>
        <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2a1602"/><stop offset="1" stop-color="#120a02"/>
        </linearGradient>
        <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff8a1e"/><stop offset="1" stop-color="#c85f00"/>
        </linearGradient>
      </defs>
      <polygon points="0,0 420,0 320,900 0,900" fill="url(#panel)"/>
      <polygon points="0,0 420,0 320,900 0,900" fill="url(#hexes)"/>
      <!-- стилизованный персонаж -->
      <g transform="translate(60,270)">
        <ellipse cx="120" cy="600" rx="130" ry="26" fill="rgba(0,0,0,.45)"/>
        <path d="M55 590 65 330q-14-70 8-118l38-38h78l38 38q22 48 8 118l10 260h-42l-16-210h-64l-16 210z" fill="#1c1c22"/>
        <path d="M73 212q-30 16-38 66l-14 96 30 8 22-96zM167 212q30 16 38 66l14 96-30 8-22-96z" fill="url(#suit)"/>
        <path d="M78 190q-10 60 42 78 52-18 42-78l-8-26H86z" fill="url(#suit)"/>
        <rect x="96" y="120" width="48" height="52" rx="14" fill="#e8b98a"/>
        <path d="M88 118q-6-58 52-58t52 58q0 18-10 26-6-40-42-40t-42 40q-10-8-10-26z" fill="#141418"/>
        <path d="M60 330h120v26H60z" fill="#0d0d10"/>
      </g>
    </svg>
  </div>

  <div class="ls-center">
    <div class="ls-logo">
      <img src="img/logo.svg" alt="">
      <div class="ls-brand"><span>HIVE</span> RP <small>AURORA</small></div>
    </div>
    <div class="ls-tabs">
      <button id="ls-tab-register" class="ls-tab">Регистрация</button>
      <button id="ls-tab-login" class="ls-tab active">Авторизация</button>
    </div>
    <label class="ls-field">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12zm0 2.2c-3.6 0-8 1.8-8 4.4V21h16v-2.4c0-2.6-4.4-4.4-8-4.4z"/></svg>
      <input id="ls-username" type="text" placeholder="Игровой ник" maxlength="16" autocomplete="off">
    </label>
    <label class="ls-field">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9zm-8 0V7a3 3 0 0 1 6 0v2z"/></svg>
      <input id="ls-password" type="password" placeholder="Пароль">
    </label>
    <label class="ls-field hidden" id="ls-password2-wrap">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9zm-8 0V7a3 3 0 0 1 6 0v2z"/></svg>
      <input id="ls-password2" type="password" placeholder="Повтори пароль">
    </label>
    <button id="ls-submit" class="ls-btn">Войти</button>
    <div class="ls-error" id="ls-error"></div>
  </div>

  <div class="ls-news" id="ls-news"></div>
</div>

<div class="app">

  <!-- ===== сайдбар ===== -->
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-logo" src="img/logo.svg" alt="">
      <span class="brand-name" id="brand-name">HIVE <b>RP</b></span>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-page="home">
        <svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        Главная</button>
      <button class="nav-item" data-page="servers">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Сервера</button>
      <button class="nav-item" data-page="news">
        <svg viewBox="0 0 24 24"><path d="M4 10v4l10 4V6zM14 8l6-3v14l-6-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Новости</button>
      <button class="nav-item" data-page="community">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        Сообщества</button>
    </nav>

    <div class="side-bottom">
      <div class="side-user hidden" id="side-user">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="su-nick" id="side-nick"></div>
          <button id="btn-logout">Выйти из аккаунта</button>
        </div>
      </div>
      <button class="side-login" id="btn-login-open">Войти</button>
    </div>
    <button class="update-banner hidden" id="update-banner">Доступно обновление <span>⭳</span></button>
  </aside>

  <!-- ===== правая часть ===== -->
  <main class="main">
    <div class="topbar">
      <div class="tb-left-zone">
        <button class="back-btn hidden" id="btn-back"><span>⟵</span> Назад к главной</button>
        <div class="tb-online" id="tb-online-wrap">Сейчас играет: <b id="online-now">—</b></div>
      </div>
      <div class="tb-actions">
        <button class="tb-btn" id="btn-settings" title="Настройки"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
        <button class="tb-btn" id="btn-min">─</button>
        <button class="tb-btn close" id="btn-close">✕</button>
      </div>
    </div>

    <div class="content" id="content">

      <!-- ГЛАВНАЯ -->
      <section class="page active" id="page-home">
        <div class="server-hero" id="hero-card">
          <div class="sh-bg"></div>
          <div class="sh-left">
            <div class="sh-players"><span id="sh-count">—</span> <span class="sh-ico">👤</span></div>
            <div class="sh-name" id="sh-name">AURORA</div>
          </div>
          <div class="sh-right">
            <div class="sh-online"><div class="sho-label">онлайн</div><div class="sho-num" id="sh-online">—</div></div>
            <button class="btn-play" id="btn-play">Играть</button>
          </div>
        </div>

        <div class="progress-wrap hidden" id="progress-wrap">
          <div class="progress-bar"><div id="progress-fill"></div></div>
          <div class="status-text" id="status-text">Подготовка...</div>
        </div>

        <div class="news-grid" id="news-grid"></div>
        <button class="more-news" id="btn-more-news">БОЛЬШЕ НОВОСТЕЙ <span>⟶</span></button>

        <h2 class="section-title">ИГРАЙ И СМОТРИ</h2>
        <div class="chips">
          <button class="chip active">Все</button>
          <button class="chip" id="chip-discord">Discord</button>
          <button class="chip" id="chip-site">Сайт</button>
        </div>
        <div class="media-strip" id="media-strip"></div>
      </section>

      <!-- СЕРВЕРА -->
      <section class="page" id="page-servers">
        <h2 class="page-h">НЕДАВНИЙ СЕРВЕР</h2>
        <div class="server-hero" id="hero-card2">
          <div class="sh-bg"></div>
          <div class="sh-left">
            <div class="sh-players"><span id="sh-count2">—</span> <span class="sh-ico">👤</span></div>
            <div class="sh-name" id="sh-name2">AURORA</div>
          </div>
          <div class="sh-right">
            <div class="sh-online"><div class="sho-label">онлайн</div><div class="sho-num" id="sh-online2">—</div></div>
            <button class="btn-play" id="btn-play2">Играть</button>
          </div>
        </div>
        <h2 class="page-h">ВСЕ СЕРВЕРА</h2>
        <div class="servers-grid" id="servers-grid"></div>
      </section>

      <!-- НОВОСТИ -->
      <section class="page" id="page-news">
        <div class="page-h-row">
          <h2 class="page-h">НОВОСТИ</h2>
          <button class="btn-admin hidden" id="btn-add-news">+ ДОБАВИТЬ НОВОСТЬ</button>
        </div>
        <div class="news-grid big" id="news-grid-full"></div>
      </section>

      <!-- СТАТЬЯ -->
      <section class="page" id="page-article">
        <div class="article">
          <div class="art-img" id="art-img"></div>
          <h1 id="art-title"></h1>
          <div class="art-date" id="art-date"></div>
          <p id="art-text"></p>
        </div>
      </section>

      <!-- СООБЩЕСТВА -->
      <section class="page" id="page-community">
        <h2 class="page-h">СООБЩЕСТВА</h2>
        <div class="soc-grid" id="soc-grid"></div>
      </section>

    </div>
  </main>
</div>


<!-- модалка настроек -->
<div class="modal-wrap hidden" id="modal-settings">
  <div class="modal">
    <button class="modal-x" data-close="modal-settings">✕</button>
    <h2>Настройки</h2>
    <label class="m-label">Оперативная память: <b id="ram-label">4096 МБ</b></label>
    <input type="range" id="ram-slider" min="1024" max="16384" step="512" value="4096">
    <div class="ram-hints"><span>1 ГБ</span><span>16 ГБ</span></div>
    <button class="btn-play wide" id="btn-save-settings">Сохранить</button>
    <div class="saved-msg" id="settings-saved"></div>
  </div>
</div>

<!-- модалка добавления новости (админ) -->
<div class="modal-wrap hidden" id="modal-news">
  <div class="modal">
    <button class="modal-x" data-close="modal-news">✕</button>
    <h2>Новая новость</h2>
    <input id="nn-title" type="text" placeholder="Заголовок" maxlength="120">
    <textarea id="nn-text" placeholder="Текст новости" rows="6"></textarea>
    <div class="nn-pick-label">Обложка:</div>
    <div class="nn-pics" id="nn-pics"></div>
    <div class="auth-error" id="nn-error"></div>
    <button class="btn-play wide" id="btn-news-save">ОПУБЛИКОВАТЬ</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
